name: Publish to PyPI

on:
  # Manually triggered (in the GitHub UI) for numbered releases.
  workflow_dispatch:
  # Nightly wheels: publish automatically once the nightly tests pass.
  # `types: [completed]` fires on any finish, so the job `if:` below filters
  # down to successful runs of the default branch.
  #
  # The `zizmor: ignore` below is safe because of the
  # `workflow_run.head_repository.full_name == github.repository` check below.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI-Nightly"]
    types: [completed]
    branches: [main]


# This job will publish the package to PyPI. It will use the release
# environment and OIDC tokens to publish the package via pypa-publish.
# See https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments
# and https://blog.pypi.org/posts/2023-04-20-introducing-trusted-publishers for more details.
jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' # only for numbered releases
    uses: ./.github/workflows/ci-nightly.yml # run CI-Nightly's jobs here
    permissions:
      contents: read

  pypi-publish:
    needs: tests
    # On a manual run `github.event.workflow_run` does not exist. Nightly tests must all pass before
    # you can release.
    # `workflow_run.head_repository.full_name == github.repository`
    # ensures this job does not run on a CI-Nightly run whose head commit
    # came from a fork.
    # `!cancelled()` is needed because: when a job has `needs:`, GitHub quietly adds
    # `success()` to its `if:`. That means the job runs only if every job it
    # needs succeeded. On a nightly run, `tests` is skipped because the successful nightly tests
    # triggered this workflow, and a skipped job
    # doesn't count as a success. So without `!cancelled()`, `pypi-publish` would
    # also be skipped on nightly runs, and nightly publishing would stop.
    # If the `if:` contains a status function such as `!cancelled()`,
    # GitHub doesn't add that hidden `success()`. So the nightly release is not impacted.
    if: >-
      !cancelled() && (
      (github.event_name == 'workflow_dispatch' && needs.tests.result == 'success') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # release-nightly environment and release environment use different
    # approval gates.
    environment:
      name: ${{ (github.event_name == 'workflow_run' && 'release-nightly') || 'release' }}
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout Tokamax
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # For nightly releases, pin to the commit CI-Nightly tested. Without this a workflow_run job
        # checks out the default branch's current HEAD, which may have moved
        # since that run started. Empty on manual dispatch, so it falls back.
        # For numbered releases, use `github.sha` (commit ID) to publish the
        # commit that we tested instead of `github.ref` (branch name).
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        persist-credentials: false

    - name: Install Python 3.12
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
      with:
        python-version: 3.12

    # Stamp the version and git revision into the working tree before building.
    # Never committed, so `main` keeps its stable version.
    - name: Stamp version and revision
      env:
        NIGHTLY: ${{ github.event_name == 'workflow_run' }}
        TESTED_SHA: ${{ github.event.workflow_run.head_sha }}  # empty on manual dispatch
      run: python .github/scripts/stamp_version.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip --version
        python -m pip install build
        python -m pip install -e .[cuda,tpu,test]
        python -m pip freeze

    # Publish the package
    - name: Build Tokamax
      run: |
        python -m build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0

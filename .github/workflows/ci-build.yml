name: CI-Build

#  Shards are declared in `.github/ci/shards.py`, which also builds the job
#  matrix and checks that every test file is claimed by some shard.
#
#  Every shard runs on every pull request.
#
#  Require `shard-all-tests-passed` in branch protection, not the shard jobs,
#  whose names and number change whenever the SHARDS table is rebalanced.
on:
  # Trigger the workflow on pull request for the main branch.
  pull_request:
    branches:
      - main
  # Event manually triggered (in the Github UI)
  workflow_dispatch:

# Constants for the workflow that are shared across jobs.
env:
  JAX_ENABLE_X64: 0
  JAX_TRACEBACK_FILTERING: off
  UV_HTTP_TIMEOUT: 300

permissions:
  contents: read
  # For the jobs API, which `shard-all-tests-passed` reads to write a summary.
  actions: read
# We should cancel the previous run if it's still running and there is a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# These jobs should build Tokamax and run the tests on Google Cloud resources.
jobs:
  shard-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.compute.outputs.include }}
      # The pytest flags that decide which tests are selected, as opposed to
      # how they are reported. Emitted by the same module that builds the
      # shard paths so the two cannot disagree about what the suite is.
      pytest_flags: ${{ steps.compute.outputs.pytest_flags }}
    steps:
      - name: Checkout Tokamax
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Test the CI scripts
        # `shards.py` decides what every other job runs
        run: python3 -m unittest discover -s .github/ci -p '*_test.py'
      - name: Build test matrix
        id: compute
        run: |
          set -o pipefail
          if ! python3 .github/ci/shards.py matrix \
              > /tmp/outputs.txt 2> /tmp/summary.txt; then
            cat /tmp/summary.txt
            exit 1
          fi
          cat /tmp/outputs.txt >> "$GITHUB_OUTPUT"
          cat /tmp/summary.txt

      - name: Warn about unsharded test files
        # Fails the run if a shard's targets have been renamed away, if a file
        # split by node ID grows a class no shard names, or if a shard's paths
        # are not test files. Stdlib only, so no install needed.
        if: steps.compute.outputs.catch_all != '[]'
        env:
          CATCH_ALL: ${{ steps.compute.outputs.catch_all }}
        run: |
          echo "::warning::Test files belong to no shard and ran in the" \
               "catch-all job: ${CATCH_ALL}. Give each one a shard in" \
               ".github/ci/shards.py; the catch-all job's --durations say" \
               "which shard has room."

      - name: List the shards
        # Log only, so that one can still see it, but not as an authoritative
        # run summary including timing data - that is done after the job ends.
        run: python3 .github/ci/shards.py list

  shard-tests:
    name: shard-tests (${{ matrix.runner_short }}, ${{ matrix.shard_name }})
    needs: shard-matrix
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.shard-matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    container:
    # Docker image will include CUDA and cuDNN for Tokamax.
      image: 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build-cuda13.2-cudnn9.15' # zizmor: ignore[unpinned-images]
    timeout-minutes: 360
    steps:
      - name: Checkout Tokamax
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          echo "Installing dependencies on device ${{ matrix.device }}"
          python3.12 -m uv pip install --upgrade pip
          python3.12 -m uv pip --version
          python3.12 -m uv pip install -e .[${{ matrix.device }},test]
          python3.12 -m uv pip freeze

      - name: Run shard
        run: |
          # Which tests run is decided by `pytest_flags` plus this shard's
          # paths, both from .github/ci/shards.py. `-s` and `--durations` are
          # reporting only: --durations lists the slowest tests in each shard,
          # which is what to rebalance the SHARDS table against.
          pytest -s --durations=25 \
            ${{ needs.shard-matrix.outputs.pytest_flags }} \
            ${{ matrix.test_paths }}

  shard-all-tests-passed:
    # The idea here is that rather than checking for specific shard names to pass, we centralize
    # the bookkeeping here, and then Copybara checks that this "result-aggregating" job passed.
    name: shard-all-tests-passed
    needs: [shard-matrix, shard-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Summarise results and timings
        # Every shard's result and wall clock, in the run summary.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs
        run: |
          # `gh` holds the token and this stays testable without one. `--jq`
          # emits one job per line. `filter=latest` is the jobs endpoint's
          # default, named here because it is load-bearing: `all` would return
          # a re-run's earlier attempts too, and a shard would be reported
          # twice, once with whatever it did the first time.
          gh api --paginate "${JOBS}?per_page=100&filter=latest" \
            --jq '.jobs[]' > /tmp/jobs.jsonl
          python3 .github/ci/summary.py < /tmp/jobs.jsonl >> "${GITHUB_STEP_SUMMARY}"

      - name: Check results
        env:
          MATRIX: ${{ needs.shard-matrix.result }}
          TESTS: ${{ needs.shard-tests.result }}
        run: |
          echo "shard-matrix=${MATRIX} tests=${TESTS}"
          # Only `success` counts. `cancelled` in particular is not a result,
          # and treating it as one is how a cancelled run reports green.
          if [[ "${MATRIX}" != "success" ]]; then
            echo "::error::shard-matrix did not succeed"
            exit 1
          fi
          if [[ "${TESTS}" != "success" ]]; then
            echo "::error::tests reported ${TESTS}"
            exit 1
          fi

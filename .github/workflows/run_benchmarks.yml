name: Run Benchmarks

on:
  workflow_dispatch:
    inputs:
      ab_mode:
        description: "Run A/B comparison (baseline vs experiment)."
        required: false
        type: boolean
        default: false
      baseline_ref:
        description: "Git ref for the baseline in A/B mode. Defaults to PR base or main."
        required: false
        type: string
        default: ""
      experiment_ref:
        description: "Git ref for the experiment in A/B mode. Defaults to current commit SHA."
        required: false
        type: string
        default: ""
      benchmark_filter:
        description: "Regex to filter by benchmark name (e.g., 'attention.*')."
        required: false
        type: string
        default: ""
      environment_filter:
        description: "Regex to filter by environment configuration ID (e.g., 'b200.*')."
        required: false
        type: string
        default: ""
      custom_metadata:
        description: "JSON string of metadata to append to the benchmark result. Overwrites static metadata from the registry but is overwritten by dynamic metadata from the workload."
        required: false
        type: string
        default: "{}"
      enable_xprof:
        description: "Enable xprof trace collection."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  run_benchmarks:
    name: Run Tokamax benchmarks
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@3caa61f05eb99b60ab6733b732184c532c2acbe4 # main
    with:
      registry_file: "tokamax/benchmarks/benchmark_registry.pbtxt"
      bap_ref: "3caa61f05eb99b60ab6733b732184c532c2acbe4"
      ab_mode: ${{ inputs.ab_mode }}
      baseline_ref: ${{ inputs.baseline_ref }}
      experiment_ref: ${{ inputs.experiment_ref }}
      benchmark_filter: ${{ inputs.benchmark_filter }}
      environment_filter: ${{ inputs.environment_filter }}
      custom_metadata: ${{ inputs.custom_metadata }}
      ############################################################
      # Temporary enable to populate looker studio test dashboards
      ############################################################
      publish_metrics: true
      pub_sub_gcp_project_id: "ml-oss-benchmarking-production"
      pub_sub_gcp_topic_id: "public-results-prod"
      ############################################################
      custom_env_vars: |
        ${{ inputs.enable_xprof == true && 'TOKAMAX_DUMP_XPROF=true' || '' }}

name: CI-Test-Sharding

# Manual workflow to validate a sharded version of ci-build.yml
on: 
  workflow_dispatch:

env:
  JAX_ENABLE_X64: 0
  JAX_TRACEBACK_FILTERING: off
  UV_HTTP_TIMEOUT: 300

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ops-tests:
    strategy:
      matrix:
        runner: ['linux-x86-a3-8g-h100-1gpu', 'linux-x86-ct6e-44-1tpu']
        shard_name: ['gmm_v2_perf', 'gmm_v2_kernel', 'ragged_dot_and_gather', 'misc_small_ops']
        include:
          - runner: 'linux-x86-a3-8g-h100-1gpu'
            device: 'cuda'
          - runner: 'linux-x86-ct6e-44-1tpu'
            device: 'tpu'
          - shard_name: 'gmm_v2_perf'
            test_paths: 'tokamax/_src/ops/ragged_dot/gmm_v2_kernel_tests/pallas_mosaic_tpu_v2_kernel_perf_test.py'
          - shard_name: 'gmm_v2_kernel'
            test_paths: 'tokamax/_src/ops/ragged_dot/gmm_v2_kernel_tests/pallas_mosaic_tpu_v2_kernel_test.py'
          - shard_name: 'ragged_dot_and_gather'
            test_paths: >-
              --ignore=tokamax/_src/ops/ragged_dot/gmm_v2_kernel_tests/pallas_mosaic_tpu_v2_kernel_perf_test.py
              --ignore=tokamax/_src/ops/ragged_dot/gmm_v2_kernel_tests/pallas_mosaic_tpu_v2_kernel_test.py
              tokamax/_src/ops/ragged_dot/
              tokamax/_src/ops/ragged_gather/
              tokamax/_src/ops/ragged_gather_reduce/
          - shard_name: 'misc_small_ops'
            test_paths: >-
              tokamax/_src/ops/flex_attention/
              tokamax/_src/ops/ragged_scatter/
              tokamax/_src/ops/gated_linear_unit/
              tokamax/_src/ops/normalization/
              tokamax/_src/ops/triangle_multiplication/
              tokamax/_src/ops/linear_softmax_cross_entropy_loss/
              tokamax/_src/ops/op_test.py
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    container:
    # Docker image will include CUDA and cuDNN for Tokamax.
      image: 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build-cuda13.2-cudnn9.15'
    timeout-minutes: 300
    steps:
      - name: Checkout Tokamax
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          echo "Installing dependencies on device ${{ matrix.device }}"
          python3.12 -m uv pip install --upgrade pip
          python3.12 -m uv pip --version
          python3.12 -m uv pip install -e .[${{ matrix.device }},test]
          python3.12 -m uv pip freeze
      - name: Test Tokamax ops with unittest
        # TODO: Disable benchmarking tests for presubmit until container is fixed
        run: |
          pytest -s -vv -m "not long" --ignore-glob="*/test_base.py" ${{ matrix.test_paths }}

